[project]
name = "nette"
version = "0.0.0"
description = "AI writes code. nette keeps it clean. A readability tool for Python in the AI-agent era."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
nette = "nette.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nette"]
