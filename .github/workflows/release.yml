name: release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install build
      - name: tag matches the package version
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared=$(grep -oE '"[0-9]+\.[0-9]+\.[0-9]+"' src/nette/__init__.py | tr -d '"')
          test "$tagged" = "$declared" || {
            echo "tag $tagged does not match __version__ $declared"
            exit 1
          }
      - run: python -m build
      - name: both distributions install and work
        run: |
          for dist in dist/*.whl dist/*.tar.gz; do
            rm -rf /tmp/smoke
            python -m venv /tmp/smoke
            /tmp/smoke/bin/pip install "$dist"
            /tmp/smoke/bin/nette --version
            /tmp/smoke/bin/nette explain over-guarded > /dev/null
          done
      - uses: pypa/gh-action-pypi-publish@release/v1
