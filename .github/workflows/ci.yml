name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e . pytest
      - run: pytest -q

  perf-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -e .
      - name: nette checks its own tree under budget
        run: |
          python - <<'EOF'
          import subprocess, sys, time

          # Budgets are sized for a GitHub runner, roughly half the speed of a
          # development laptop. They guard against a regression, not a target.
          COLD_BUDGET_MS = 1000
          WARM_BUDGET_MS = 300

          def run_ms(args):
              start = time.perf_counter()
              subprocess.run(args, check=False, capture_output=True)
              return (time.perf_counter() - start) * 1000

          target = ["nette", "check", "src", "tests"]
          cold = run_ms([*target, "--no-cache"])
          run_ms(target)              # this run populates the cache
          warm = run_ms(target)       # only this one is warm

          print(f"cold: {cold:.0f} ms (budget {COLD_BUDGET_MS})")
          print(f"warm: {warm:.0f} ms (budget {WARM_BUDGET_MS})")
          sys.exit(0 if cold < COLD_BUDGET_MS and warm < WARM_BUDGET_MS else 1)
          EOF

  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -e .
      - name: nette is clean under its own rules
        run: nette check src tests --format concise
